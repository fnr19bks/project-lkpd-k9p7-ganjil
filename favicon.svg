<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Laptop dan pena - jurnalis digital">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2B4FBF"/>
    </linearGradient>
  </defs>

  <!-- Latar -->
  <rect width="64" height="64" rx="13" fill="url(#bgGrad)"/>

  <!-- Layar laptop -->
  <rect x="13" y="15" width="38" height="25" rx="3" fill="#F8FAFC"/>
  <rect x="17" y="19" width="30" height="17" rx="2" fill="#1E3A8A"/>

  <!-- Baris teks di layar -->
  <rect x="20" y="22" width="16" height="2.4" rx="1.2" fill="#F59E0B"/>
  <rect x="20" y="26" width="22" height="2.4" rx="1.2" fill="#93C5FD"/>
  <rect x="20" y="30" width="12" height="2.4" rx="1.2" fill="#93C5FD"/>

  <!-- Basis laptop -->
  <rect x="9" y="41" width="46" height="4.5" rx="2.2" fill="#F59E0B"/>

  <!-- Pena jurnalis -->
  <g transform="rotate(-38 44 44)">
    <rect x="41.5" y="30" width="5.5" height="22" rx="1.6" fill="#F59E0B" stroke="#F8FAFC" stroke-width="1.6"/>
    <polygon points="41.5,52 44.25,58 47,52" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1"/>
    <rect x="41.5" y="30" width="5.5" height="3" rx="1" fill="#EF4444"/>
  </g>

  <!-- Kilau -->
  <circle cx="17" cy="12" r="2.4" fill="#F59E0B" opacity="0.9"/>
</svg>